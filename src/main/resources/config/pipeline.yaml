    outboundTopic: "projects/sand-480914/topics/tb-catalog-product-outbound"
    inputSubscription: "projects/sand-480914/subscriptions/tb-catalog-product-inbound-sub"

mongodb:
  uri: "mongodb+srv://tb_gb225_db_user:7Ao2rXNvNJ9flhG7@tb-menswearclub.535gxzn.mongodb.net/?appName=tb-menswearclub"
  database: "catalog_db"
  collection: "products"

pipeline:
  runner: "DirectRunner"   # DirectRunner OR DataflowRunner
  streaming: true

csv:
  inputFile: "src/main/resources/Data/TBUniverseProducts.csv"

commerce:
  # ── Token endpoint (OAuth2 client-credentials) ────────────────────────────
  authUrl: "https://auth.us-central1.gcp.commercetools.com"
  # Base64-encoded clientId:clientSecret  ← keep secret in production
  # client_id : dwjDsHvbCQC1HbEC7kKyPc1A
  # secret    : mINHdFCAL7ieO6s9ZFBwuEmNu_Zvm9Uw
  clientCredentials: "ZHdqRHNIdmJDUUMxSGJFQzdrS3lQYzFBOm1JTkhkRkNBTDdpZU82czlaRkJ3dUVtTnVfWnZtOVV3"
  # OAuth2 scope to request when fetching a client-credentials token.
  # This admin client uses manage_project:data-import (full project access) instead of
  # individual resource scopes, because CT token endpoint does strict exact-string matching —
  # manage_project does NOT automatically allow requesting narrower sub-scopes separately.
  scope: "manage_project:data-import"

  # ── Products API ──────────────────────────────────────────────────────────
  apiUrl: "https://api.us-central1.gcp.commercetools.com"
  projectKey: "data-import"

  # Primary product type – required (or leave blank to auto-detect when exactly one type exists).
  productTypeKey: "9c405e7c-0d87-4963-af46-de4355fdd1e0"

  # Secondary product type – optional.
  # When set, records are routed to primary or secondary based on the division routing rule below.
  secondaryProductTypeKey: "ce66dd7e-c375-4f43-9203-0d9c314ade78"

  # Legacy division-based routing (no longer used for the dual-post flow).
  # Every CSV row now creates/updates BOTH a Tier-1 and a Tier-2 product.
  # Kept here for backward compatibility; has no effect on the current pipeline.
  primaryProductTypeDivisions:
    - "10"

  # ── Resilience ────────────────────────────────────────────────────────────
  connectTimeoutMs: 5000
  readTimeoutMs: 15000
  maxRetries: 3
  backoffMs: 500
